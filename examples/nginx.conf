# nginx — auth_request in front of an upstream.
upstream forwardauth { server 127.0.0.1:8080; }
upstream app         { server 127.0.0.1:3000; }

server {
    listen 443 ssl;
    server_name app.example.com;

    location = /_cf_access_verify {
        internal;
        proxy_pass              http://forwardauth/verify;
        proxy_pass_request_body off;
        proxy_set_header        Content-Length "";
        proxy_set_header        Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
        proxy_set_header        Cookie $http_cookie;
    }

    location / {
        auth_request            /_cf_access_verify;
        auth_request_set        $remote_user  $upstream_http_x_remote_user;
        auth_request_set        $remote_email $upstream_http_x_remote_user_email;
        proxy_set_header        X-Remote-User       $remote_user;    # overwrites whatever the client sent
        proxy_set_header        X-Remote-User-Email $remote_email;
        proxy_pass              http://app;
    }
}
