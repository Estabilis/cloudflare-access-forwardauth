# Traefik (Kubernetes CRD provider) — ForwardAuth middleware in front of an Ingress.
# Replace <namespace>, the team domain and the AUD tag of your Access application.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-access-forwardauth
spec:
  replicas: 2
  selector: {matchLabels: {app: cloudflare-access-forwardauth}}
  template:
    metadata:
      labels: {app: cloudflare-access-forwardauth}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: forwardauth
          image: ghcr.io/estabilis/cloudflare-access-forwardauth:latest   # pin a version/digest in production
          env:
            - {name: CF_ACCESS_TEAM_DOMAIN, value: "<team>.cloudflareaccess.com"}
            - {name: CF_ACCESS_AUD, value: "<application audience tag>"}
            # - {name: SERVICE_TOKENS, value: "pass"}   # let Access service tokens reach the app (it does its own API auth)
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 30}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: cloudflare-access-forwardauth
spec:
  selector: {app: cloudflare-access-forwardauth}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cloudflare-access
spec:
  forwardAuth:
    address: http://cloudflare-access-forwardauth.<namespace>.svc.cluster.local:8080/verify
    # Copied onto the upstream request, REPLACING any value the client sent.
    authResponseHeaders:
      - X-Remote-User
      - X-Remote-User-Email
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: <namespace>-cloudflare-access@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: app.example.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: my-app, port: {number: 80}}}}
